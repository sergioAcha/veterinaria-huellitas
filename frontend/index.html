<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f2e9">
  <meta id="site-description" name="description" content="">
  <title id="page-title">Cafetería</title>
  <style>[hidden]{display:none!important}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <p id="site-loading" class="section" role="status">Cargando la información...</p>
  <p id="site-error" class="section" role="alert" hidden></p>
  <header class="site-header" hidden>
    <a class="brand" href="#inicio" aria-label="Inicio">
      <span class="brand-icon">✳</span>
      <span><span class="brand-name"></span><span class="brand-dot">.</span><small class="brand-tagline"></small></span>
    </a>
    <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav class="nav">
      <a href="#servicios">La carta</a><a href="#especialidades">Lo que nos inspira</a>
      <a href="#nosotros">Nosotros</a><a href="#precios">Precios</a><a href="#contacto">Contacto</a>
    </nav>
    <a class="header-cta" href="#contacto"><span id="header-cta-label"></span><span>↗</span></a>
  </header>
  <main hidden>
    <section id="inicio" class="hero">
      <div class="hero-copy">
        <p class="eyebrow"><span class="eyebrow-line"></span><span id="hero-eyebrow"></span></p>
        <h1 id="hero-title"></h1>
        <p id="hero-subtitle" class="hero-lead"></p>
        <div class="hero-actions">
          <a class="button button-dark" href="#nosotros">Conócenos <span>↗</span></a>
          <a class="text-link" href="#servicios"><span class="play">▶</span> Explorar la carta</a>
        </div>
        <div class="hero-trust">
          <div class="avatar-stack"><span>☕</span><span>🥐</span><span>🍰</span></div>
          <p><strong id="hero-trust-title"></strong><br><span id="hero-trust-text"></span></p>
        </div>
      </div>
      <div class="hero-visual">
        <div class="video-frame">
          <img id="hero-image" alt="" fetchpriority="high">
          <div class="video-shade"></div>
          <div class="video-label"><span class="live-dot"></span><span id="hero-caption"></span></div>
          <div class="paw-stamp">☕</div>
        </div>
      </div>
      <div class="hero-bottom">
        <span id="hero-bottom-1"></span><span id="hero-bottom-2"></span><span id="hero-bottom-3"></span>
      </div>
    </section>
    <section class="welcome-strip">
      <span>☕</span><p id="welcome-message"></p><span id="welcome-label" class="strip-note"></span>
    </section>
    <section id="servicios" class="section services-section">
      <div class="section-heading">
        <div><p id="menu-eyebrow" class="eyebrow"></p><h2 id="menu-heading"></h2></div>
        <p id="menu-description" class="section-intro"></p>
      </div>
      <div id="services-grid" class="card-grid"></div>
    </section>
    <section id="especialidades" class="specialty-section">
      <div class="specialty-inner">
        <div class="section-heading">
          <div><p id="features-eyebrow" class="eyebrow eyebrow-light"></p><h2 id="features-heading"></h2></div>
          <p id="features-description" class="section-intro"></p>
        </div>
        <div id="specialties-grid" class="specialty-grid"></div>
      </div>
      <div class="specialty-orbit">✳</div>
    </section>
    <section id="nosotros" class="section about-section">
      <div class="about-photo">
        <img id="about-image" alt="" loading="lazy">
        <div class="photo-note"><span>✳</span><p id="about-photo-note"></p></div>
      </div>
      <div class="about-copy">
        <p id="about-eyebrow" class="eyebrow"></p><h2 id="about-heading"></h2>
        <p id="about-history" class="about-text"></p>
        <div class="about-facts">
          <div><strong>01</strong><span id="about-fact-1"></span></div>
          <div><strong>02</strong><span id="about-fact-2"></span></div>
          <div><strong>03</strong><span id="about-fact-3"></span></div>
        </div>
        <a class="text-link" href="#contacto"><span id="about-cta"></span> <span>↗</span></a>
      </div>
    </section>
    <section id="precios" class="prices-section">
      <div class="section-heading">
        <div><p id="prices-eyebrow" class="eyebrow"></p><h2 id="prices-heading"></h2></div>
        <p id="prices-description" class="section-intro"></p>
      </div>
      <div id="prices-list" class="prices-list"></div>
      <p id="prices-note" class="price-note"></p>
    </section>
    <section id="contacto" class="contact-section">
      <div class="contact-inner">
        <div class="contact-copy">
          <p id="contact-eyebrow" class="eyebrow eyebrow-light"></p><h2 id="contact-heading"></h2>
          <p id="contact-description"></p><div id="contact-details" class="contact-details"></div>
        </div>
        <form id="contact-form" class="contact-form">
          <div class="form-title"><span>✳</span><h3>Escríbenos</h3></div>
          <div class="form-row">
            <label>Tu nombre<input name="name" required maxlength="120" placeholder="¿Cómo te llamas?"></label>
            <label>Correo electrónico<input name="email" type="email" required maxlength="190" placeholder="tu@correo.com"></label>
          </div>
          <label>Teléfono <span class="optional">(opcional)</span><input name="phone" maxlength="40" placeholder="+591"></label>
          <label>¿Sobre qué quieres consultarnos?<input name="subject" required maxlength="180" placeholder="La carta, horarios, reservas..."></label>
          <label>Tu mensaje<textarea name="message" rows="3" required maxlength="4000" placeholder="Escribe aquí..."></textarea></label>
          <button class="button button-lime" type="submit">Enviar mensaje <span>↗</span></button>
          <p id="form-status" class="form-status" role="status"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="footer" hidden>
    <a class="brand brand-footer" href="#inicio">
      <span class="brand-icon">✳</span>
      <span><span class="brand-name"></span><span class="brand-dot">.</span><small class="brand-tagline"></small></span>
    </a>
    <p id="footer-note"></p><span>© <span id="year"></span> <span id="footer-business-name"></span></span>
  </footer>
  <button id="chat-toggle" class="chat-toggle" aria-label="Abrir asistente" hidden><span>✳</span><span class="chat-label">¿Te ayudo?</span></button>
  <aside id="chat-panel" class="chat-panel" hidden>
    <div class="chat-head">
      <div><span class="chat-avatar">✳</span><span><strong id="chat-name"></strong><small id="chat-subtitle"></small></span></div>
      <button id="chat-close" aria-label="Cerrar chat">×</button>
    </div>
    <div id="chat-messages" class="chat-messages"><div id="chat-greeting" class="chat-bubble bot"></div></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" maxlength="1500" placeholder="Escribe tu pregunta..." required aria-label="Tu pregunta">
      <button aria-label="Enviar mensaje">↑</button>
    </form>
    <p id="chat-disclaimer" class="chat-disclaimer"></p>
  </aside>
  <script src="app.js" defer></script>
</body>
</html>
